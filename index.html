<style>
@font-face{font-family:"HQ Vazir";font-style:normal;font-display:swap;font-weight:100 900;src:url(vazir-arabic.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"HQ Vazir";font-style:normal;font-display:swap;font-weight:100 900;src:url(vazir-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"HQ Markazi";font-style:normal;font-display:swap;font-weight:400 700;src:url(markazi-arabic.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
/* Layout: a one-column training log. The seven-day strip (Saturday on the right, Friday on the left) is the spine of every view; each friend's own color is the only loud element. */
:root{
  --bg:#EDF1F0;--surface:#FFFFFF;--surface-2:#F3F6F5;--ink:#132220;--ink-2:#4A5B58;--ink-3:#7A8986;
  --line:#DAE3E1;--track:#E1E8E6;
  --accent:#0A7A75;--accent-ink:#FFFFFF;--accent-soft:#D4EDEA;
  --gold:#8C5B00;--gold-mark:#C08A12;--gold-soft:#F8EDD3;--flame:#D2602A;
  --good:#1B7743;--good-soft:#DBEFE2;--warn:#8A5806;--warn-soft:#F6EAD0;--bad:#AD3731;--bad-soft:#F6DEDB;--on-bad:#FFFFFF;
  --on-member:#FFFFFF;--scrim:rgba(9,20,19,.44);
  --c0:#0E8580;--c1:#B37400;--c2:#C43947;--c3:#2D57C0;--c4:#56841C;--c5:#7943BA;--c6:#B35321;--c7:#B73F86;
  --shadow:0 1px 2px rgba(19,34,32,.05),0 10px 28px rgba(19,34,32,.10);
  --f-display:"HQ Markazi","Markazi Text","HQ Vazir",Tahoma,serif;
  --f-ui:"HQ Vazir",Vazirmatn,Vazir,Tahoma,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1312;--surface:#121C1B;--surface-2:#182423;--ink:#E3EDEB;--ink-2:#A1B2AF;--ink-3:#71837F;
  --line:#25332F;--track:#22302E;
  --accent:#33C2BA;--accent-ink:#04201E;--accent-soft:#113230;
  --gold:#EFB443;--gold-mark:#EFB443;--gold-soft:#30260E;--flame:#F08A4B;
  --good:#4FC985;--good-soft:#122E1F;--warn:#E6B04F;--warn-soft:#33270F;--bad:#F07B74;--bad-soft:#381715;--on-bad:#2A0907;
  --on-member:#0A1413;--scrim:rgba(0,0,0,.62);
  --c0:#35C2BB;--c1:#F0B33F;--c2:#F2737E;--c3:#7997F4;--c4:#9DCB5B;--c5:#B589EF;--c6:#F09261;--c7:#EE82C4;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1312;--surface:#121C1B;--surface-2:#182423;--ink:#E3EDEB;--ink-2:#A1B2AF;--ink-3:#71837F;
  --line:#25332F;--track:#22302E;
  --accent:#33C2BA;--accent-ink:#04201E;--accent-soft:#113230;
  --gold:#EFB443;--gold-mark:#EFB443;--gold-soft:#30260E;--flame:#F08A4B;
  --good:#4FC985;--good-soft:#122E1F;--warn:#E6B04F;--warn-soft:#33270F;--bad:#F07B74;--bad-soft:#381715;--on-bad:#2A0907;
  --on-member:#0A1413;--scrim:rgba(0,0,0,.62);
  --c0:#35C2BB;--c1:#F0B33F;--c2:#F2737E;--c3:#7997F4;--c4:#9DCB5B;--c5:#B589EF;--c6:#F09261;--c7:#EE82C4;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b,strong{font-weight:800}

.inner{max-width:640px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 2px}
.brand-id{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;flex:none}
.mark-track{fill:none;stroke:var(--track);stroke-width:5}
.mark-fill{fill:none;stroke:var(--accent);stroke-width:5}
.brand-name{font:700 27px/1.1 var(--f-display);color:var(--ink)}
.brand-tag{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.me-chip{appearance:none;display:inline-flex;align-items:center;gap:8px;max-width:46%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding-block:4px;padding-inline:4px 12px;font:700 13.5px/1.2 var(--f-ui);cursor:pointer}
.me-chip span.me-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.tabs-band{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;margin-block:10px 6px;background:var(--surface);border:1px solid var(--line);border-radius:15px}
.tab{appearance:none;border:0;background:transparent;color:var(--ink-2);font:700 14.5px/1.2 var(--f-ui);padding:11px 4px;border-radius:11px;cursor:pointer;min-width:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab:not([aria-selected="true"]):hover{color:var(--ink)}

.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 64px;min-width:0}
.view > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.h2{margin:0;font:700 21px/1.35 var(--f-display);color:var(--ink);text-wrap:balance}
.h2-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;margin-bottom:12px}
.muted{color:var(--ink-3);font-size:13px;margin:0}
.label{font-size:13px;font-weight:700;color:var(--ink-2)}
.note{margin:0;font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center;justify-content:center;text-align:center}
.note .ic{width:16px;height:16px}

.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.ic-fill{fill:currentColor;stroke:none}
.ic-crown{fill:var(--gold-mark);stroke:var(--gold-mark);stroke-width:1.4;width:18px;height:18px}
.ic-flame{fill:var(--flame);stroke:none;width:15px;height:15px}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px/1.3 var(--f-ui);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.55;cursor:default}
.btn .ic{width:18px;height:18px}
.link-btn{appearance:none;border:0;background:none;color:var(--accent);font:700 13.5px/1.4 var(--f-ui);padding:6px 2px;cursor:pointer}
.icon-btn{appearance:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icon-btn:disabled{opacity:.32;cursor:default}
.icon-btn.sm{width:36px;height:36px;border-radius:10px;border-color:transparent;background:transparent;color:var(--ink-3)}
.icon-btn.sm .ic{width:18px;height:18px}

.state-card{text-align:center;padding:44px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-2)}
.state-card h2{margin:0;color:var(--ink);font:700 25px/1.4 var(--f-display)}
.state-card p{margin:0;max-width:30em}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);animation:hq-spin .9s linear infinite}

.weekbar{display:flex;align-items:center;gap:10px}
.weekbar-mid{flex:1;min-width:0;text-align:center}
.weekbar-rel{font:800 13px/1.3 var(--f-ui);color:var(--accent)}
.weekbar-range{font:700 21px/1.35 var(--f-display);color:var(--ink)}
.weekbar-back{display:flex;justify-content:center;margin-top:-8px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:15px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.banner > .ic{color:var(--accent);margin-top:3px}
.banner.warn{background:var(--warn-soft)}
.banner.warn > .ic{color:var(--warn)}
.banner.gold{background:var(--gold-soft)}
.banner-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.banner-actions{display:flex;flex-wrap:wrap;gap:12px}

.summary{display:flex;align-items:center;gap:16px}
.ring-box{position:relative;flex:none}
.ring{display:block}
.ring-track{fill:none;stroke:var(--track)}
.ring-val{fill:none;stroke:var(--mc,var(--accent));stroke-linecap:round}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;font:800 22px/1 var(--f-ui);color:var(--ink);font-variant-numeric:tabular-nums}
.summary-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.summary-title{margin:0;font:700 21px/1.3 var(--f-display);text-wrap:balance}
.summary-line{margin:0;color:var(--ink-2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);line-height:1.6}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.goals{display:flex;flex-direction:column;gap:10px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.goal.complete{border-color:var(--mc)}
.goal-head{display:flex;align-items:flex-start;gap:6px}
.goal-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.goal-title{margin:0;font:800 16.5px/1.45 var(--f-ui);overflow-wrap:anywhere}
.goal-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--ink-2)}
.goal-meta b{color:var(--ink)}
.goal-meta .ok{color:var(--good);font-weight:800;display:inline-flex;align-items:center;gap:3px}
.goal-meta .ok .ic{width:16px;height:16px;stroke-width:2.6}
.goal-meta .bad{color:var(--bad);font-weight:700}
.goal-meta .warn{color:var(--warn);font-weight:700}
.bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--mc,var(--accent))}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
.day-name{font-size:12px;line-height:1;font-weight:700}
.day-box{width:100%;max-width:48px;aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-3);transition:transform .12s ease}
.day-box .ic{width:22px;height:22px;stroke-width:2.8}
.day-val{font-weight:800;font-size:13px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.day.done .day-box{background:var(--mc);border-color:var(--mc);color:var(--on-member)}
.day.part .day-box{background:var(--surface-2);background:color-mix(in srgb,var(--mc) 15%,var(--surface));border-color:var(--mc)}
.day.today .day-name{color:var(--mc);font-weight:800}
.day.today:not(.done):not(.part) .day-box{border:2px solid var(--mc);background:var(--surface)}
.day.future .day-box{border-style:dashed;background:transparent}
.day:disabled{cursor:default}
.day:disabled:not(.done):not(.part) .day-box{opacity:.55}
.day:not(:disabled):active .day-box{transform:scale(.92)}
@media (hover:hover){.day:not(:disabled):hover .day-box{border-color:var(--mc)}}

.add-goal{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:1.5px dashed var(--line);border-radius:18px;background:transparent;color:var(--accent);font:800 15px/1.3 var(--f-ui);cursor:pointer}
.add-goal small{color:var(--ink-3);font-weight:600}
.empty{display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:start;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:13px;padding:10px 12px;font:800 14px/1.4 var(--f-ui);cursor:pointer;min-width:0}
.tpl small{font-weight:600;font-size:12px;color:var(--ink-3)}

.rings{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 10px}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:78px;position:relative}
.ring-item .ring-center{font-size:16px}
.ring-item.idle .ring-center{color:var(--ink-3);font-size:13px}
.ring-name{font-weight:800;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.ring-sub{font-size:11.5px;color:var(--ink-3);line-height:1.2;margin-top:-4px}
.ring-crown{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:1;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface)}
.team-line{font-size:13.5px;color:var(--ink-2)}
.team-line b{color:var(--ink)}
.champ{margin-top:14px;display:flex;align-items:center;gap:8px;justify-content:center;padding:10px 12px;border-radius:13px;background:var(--gold-soft);color:var(--ink);font-size:14px;text-align:center;flex-wrap:wrap}

.stake{background:var(--gold-soft);border-color:transparent}
.stake-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stake-label{font-weight:800;color:var(--gold);font-size:13px}
.stake-text{margin:4px 0 0;font:700 21px/1.5 var(--f-display);overflow-wrap:anywhere}
.stake-by{margin:0;font-size:12.5px;color:var(--ink-2)}
.stake-empty{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.stake-result{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}

.board{padding:6px 0}
.board > .h2-row{padding:10px 16px 0;margin-bottom:4px}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow-main{width:100%;appearance:none;border:0;background:transparent;font:inherit;color:inherit;text-align:start;display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
.mrow-rank{width:24px;flex:none;text-align:center;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;background:var(--mc);color:var(--on-member);font:800 calc(var(--s) * .44)/1 var(--f-ui);flex:none}
.mrow-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mrow-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.mrow-name small{font-weight:600;color:var(--ink-3);font-size:12px}
.mrow-sub{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;line-height:1.5}
.mrow-sub .streak{display:inline-flex;align-items:center;gap:2px;font-weight:800;color:var(--flame)}
.mrow-pct{font:800 18px/1 var(--f-ui);font-variant-numeric:tabular-nums;flex:none;min-width:46px;text-align:end}
.mrow-chev{color:var(--ink-3);display:grid;place-items:center;transition:transform .2s ease}
.mrow-chev .ic{width:18px;height:18px}
.mrow.open .mrow-chev{transform:rotate(180deg)}
.mrow-detail{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.pace-ahead{color:var(--good);font-weight:800}
.pace-on{color:var(--accent);font-weight:800}
.pace-behind{color:var(--bad);font-weight:800}
.pace-done{color:var(--good);font-weight:800}
.mini-goal{background:var(--surface-2);border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mini-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px}
.mini-title{font-weight:800;min-width:0;overflow-wrap:anywhere}
.mini-val{color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.mini-val.ok{color:var(--good);font-weight:800}
.mini-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mini-day{height:24px;border-radius:7px;background:var(--track);display:grid;place-items:center;font-size:11px;color:var(--ink-3);font-weight:800;line-height:1;min-width:0;overflow:hidden}
.mini-day.on{background:var(--mc);color:var(--on-member)}
.mini-day.part{background:var(--track);background:color-mix(in srgb,var(--mc) 24%,var(--surface));color:var(--ink)}
.mini-day.today{box-shadow:inset 0 0 0 1.5px var(--mc)}
.mini-day.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.detail-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.detail-empty{margin:0;color:var(--ink-3);font-size:13.5px}

.wmap-grid{display:flex;flex-direction:column;gap:6px}
.wmap-row{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.wmap-name{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wmap-day{text-align:center;font-size:11.5px;color:var(--ink-3);font-weight:800}
.wmap-day.today{color:var(--accent)}

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  root.lang = 'fa';
  root.dir = 'rtl';
  /* ================= standalone sync layer: the group's data lives in a private GitHub repository ================= */
  const NET = (function () {
    const KEY = 'hq.';
    const ls = {
      get(k) { try { return window.localStorage.getItem(KEY + k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(KEY + k, String(v)); } catch (e) { /* storage blocked */ } },
      del(k) { try { window.localStorage.removeItem(KEY + k); } catch (e) { /* storage blocked */ } }
    };
    const API = (ls.get('api') || 'https://api.github.com').replace(/\/+$/, '');
    const REPO_RE = /^[A-Za-z0-9-]{1,39}\/[A-Za-z0-9._-]{1,100}$/;
    const isO = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

    const SEGRE = /^[A-Za-z0-9_\-.~:@+]{1,200}$/;
    function checkPath(p, even) {
      if (typeof p !== 'string' || !p) throw new TypeError('path must be a non-empty string');
      const segs = p.split('/');
      for (const s of segs) if (!SEGRE.test(s) || s === '.' || s === '..') throw new TypeError('bad path segment in ' + p);
      if ((segs.length % 2 === 0) !== even) throw new TypeError('wrong segment count for ' + p);
    }
    const idOf = (p) => p.slice(p.lastIndexOf('/') + 1);
    const err = (code, extra) => Object.assign({ code: code, message: code }, extra || {});
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const YMD = /^\d{4}-\d{2}-\d{2}$/;

    /* text <-> base64 (UTF-8 safe) */
    function toB64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    }
    function fromB64(b64) {
      const bin = atob(String(b64 || '').replace(/\s+/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    const b64url = (s) => btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    function unb64url(s) { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return atob(s); }

    /* group key: which repository and which token. It travels in the invite link. */
    function parseKey(k) {
      try {
        const j = JSON.parse(unb64url(k));
        if (j && typeof j.r === 'string' && REPO_RE.test(j.r) && typeof j.t === 'string' && /^[A-Za-z0-9_]{20,255}$/.test(j.t)) return { repo: j.r, token: j.t, branch: typeof j.b === 'string' && /^[A-Za-z0-9._\/-]{1,100}$/.test(j.b) ? j.b : 'main' };

    }
    const makeKey = (c) => b64url(JSON.stringify({ r: c.repo, t: c.token, b: c.branch || 'main' }));
    function keyFromText(text) {
      const t = String(text || '').trim();
      const m = t.match(/[?&#]k=([A-Za-z0-9_-]+)/);
      return parseKey(m ? m[1] : t);
    }

    let cfg = null, owner = false;
    try {
      const q = new URLSearchParams(location.search);
      const c = q.get('k') ? parseKey(q.get('k')) : null;
      if (c) { cfg = c; ls.set('cfg', JSON.stringify(c)); }
      if (q.get('o') === '1') { owner = true; ls.set('owner', '1'); }
    } catch (e) { /* ignore */ }
    if (!cfg) { try { const c = JSON.parse(ls.get('cfg') || 'null'); if (c && REPO_RE.test(c.repo) && c.token) cfg = { repo: c.repo, token: c.token, branch: c.branch || 'main' }; } catch (e) { /* ignore */ } }
    if (!owner) owner = ls.get('owner') === '1';
    const base = () => location.origin + location.pathname;
    function linkFor(withOwner) {
      if (!cfg) return base();
      return base() + '?k=' + makeKey(cfg) + (withOwner && owner ? '&o=1' : '');

    // keep the key in the address bar, so Add to Home Screen carries it into the installed app
    try { if (cfg) { const want = linkFor(true); if (location.href.split('#')[0] !== want) history.replaceState(null, '', want + location.hash); } } catch (e) { /* ignore */ }

    let online = true, authLostFn = null, onlineFn = null;
    function setOnline(v) { if (online !== v) { online = v; if (onlineFn) try { onlineFn(v); } catch (e) { /* ignore */ } } }

    async function gh(method, path, body, opts) {
      opts = opts || {};
      const token = opts.token || (cfg && cfg.token);
      const headers = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      if (body) headers['Content-Type'] = 'application/json';
      if (opts.etag) headers['If-None-Match'] = opts.etag;

      const msg = (j && j.message) || '';
      if (r.status === 401) { if (!opts.token && authLostFn) try { authLostFn(); } catch (e) { /* ignore */ } throw err('not_granted', { auth: true, status: 401 }); }

      if (col === 'plans' && YMD.test(id.slice(0, 10))) return { file: 'plans/' + id.slice(0, 10) + '.json', key: id };
      if (col === 'social' && YMD.test(id)) return { file: 'social/' + id + '.json', key: id };

      h += '<div class="goals">' + goals.map((g, i) => goalCardHTML(m, plan, g, st.per[i], w)).join('') + '</div>';
      if (canEditGoals(w)) {
        h += goals.length < MAX_GOALS
          ? '<button type="button" class="add-goal" id="add-goal" data-act="goal-new">' + ICON.plus + '<span>هدف جدید</span><small>' + fd(goals.length) + ' از ' + fd(MAX_GOALS) + '</small></button>'
          : '<p class="note">به سقف ' + fd(MAX_GOALS) + ' هدف رسیدی.</p>';
      }
    }
    h += lockNote(w);
    if (w === cur && goals.length) h += '<p class="note">هر روز روی خونه‌ی امروز بزن. هفته شنبه شروع میشه و جمعه بسته میشه.</p>';
    if (NET && S.members.length <= 1) h += inviteHTML();
    return h;
  }
  function summaryHTML(m, st, w) {
    const cur = curWeek(), isCur = w === cur;
    const sd = standings(w);
    const row = sd.ranked.find((r) => r.m.id === m.id);
    const chips = [];
    if (isCur) {
      const p = paceOf(st.score);
      const cls = p.k === 'behind' ? 'bad' : p.k === 'on' ? 'acc' : 'good';
      chips.push('<span class="chip ' + cls + '">' + p.t + '</span>');
      chips.push('<span class="chip">' + daysLeftText() + '</span>');
    } else if (w < cur) {
      chips.push(st.score >= SUCCESS - 1e-9 ? '<span class="chip good">هفته‌ی موفق</span>' : '<span class="chip warn">زیر ۸۰٪</span>');
    }
    const streak = isCur ? streakOf(m.id) : 0;
    if (streak > 0) chips.push('<span class="chip gold">' + ICON.flame + fd(streak) + ' هفته‌ی موفق پشت سر هم</span>');
    if (row && sd.ranked.length > 1 && w <= cur) chips.push('<span class="chip">رتبه‌ی ' + fd(row.rank) + ' از ' + fd(sd.ranked.length) + '</span>');
    const kud = w <= cur ? kudosReceived(m.id, w) : 0;
    if (kud > 0) chips.push('<span class="chip gold">' + ICON.spark + fd(kud) + ' دمت گرم گرفتی</span>');
    let title, line;
    if (isCur) {
      const t = today();
      title = 'امروز ' + DAYS[dayIdx(t)] + '، ' + jDay(t);
      line = fd(st.full) + ' از ' + fd(st.goals) + ' هدف کامل شده';
    } else if (w < cur) {
      title = 'نتیجه‌ی نهایی این هفته';
      line = fd(st.full) + ' از ' + fd(st.goals) + ' هدف کامل شد';
    } else {
      title = 'برنامه‌ی هفته‌ی بعد';
      line = fd(st.goals) + ' هدف چیدی؛ از شنبه شروع میشه';
    }
    let expect = '';
    if (isCur) { const p = paceOf(st.score); if (p.e !== undefined && p.e > 0) expect = '<p class="muted">انتظار تا امروز حدود ' + fpct(p.e) + '</p>'; }
    return '<section class="card summary" style="' + mvar(m) + '">' +
      '<div class="ring-box">' + ring(st.score, 96, 11) + '<div class="ring-center">' + fpct(st.score) + '</div></div>' +
      '<div class="summary-body"><h2 class="summary-title">' + title + '</h2><p class="summary-line">' + line + '</p>' +
      (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') + expect + '</div></section>';
  }
  function goalCardHTML(m, plan, g, p, w) {
    const td = today();
    let cells = '';
    for (let d = 0; d < 7; d++) {
      const date = addDays(w, d);
      const v = entryVal(plan.log, g.id, d);
      const isToday = date === td, future = date > td;
      const can = dayEditable(w, d);
      let cls = 'day';
      if (v > 0) cls += g.kind === 'days' ? ' done' : ' part';
      if (isToday) cls += ' today';
      if (future) cls += ' future';
      const state = v > 0 ? (g.kind === 'days' ? 'انجام شد' : fnum(v) + ' ' + g.unit) : (future ? 'هنوز نرسیده' : 'انجام نشده');
      const inner = v > 0 ? (g.kind === 'days' ? ICON.check : '<span class="day-val">' + fnum(v) + '</span>') : '';
      cells += '<button type="button" class="' + cls + '" id="d-' + g.id + '-' + d + '" data-act="day" data-gid="' + g.id + '" data-d="' + d + '"' +
        (can ? '' : ' disabled') + ' aria-pressed="' + (v > 0) + '" aria-label="' + esc(g.title + '، ' + DAYS[d] + (isToday ? ' (امروز)' : '') + '، ' + state) + '">' +
        '<span class="day-name">' + DAYS_SHORT[d] + '</span><span class="day-box">' + inner + '</span></button>';
    }
    const edit = canEditGoals(w) ? '<button type="button" class="icon-btn sm" id="ge-' + g.id + '" data-act="goal-edit" data-gid="' + g.id + '" aria-label="' + esc('ویرایش ' + g.title) + '">' + ICON.edit + '</button>' : '';
    const hint = goalHint(g, p, plan, w);
    return '<article class="goal' + (p.full ? ' complete' : '') + '" style="' + mvar(m) + '">' +
      '<div class="goal-head"><div class="goal-titles"><h3 class="goal-title">' + esc(g.title) + '</h3>' +
      '<div class="goal-meta"><span><b>' + progressText(g, p) + '</b></span>' + (hint ? '<span>' + hint + '</span>' : '') + '</div></div>' + edit + '</div>' +
      '<div class="bar"><span style="width:' + pctW(p.ratio) + '"></span></div>' +
      '<div class="days">' + cells + '</div></article>';
  }
  function emptyGoalsHTML(m, w) {
    const cur = curWeek();
    if (!canEditGoals(w)) {
      return '<section class="card empty"><h2 class="h2">' + (w < cur ? 'این هفته هدفی ثبت نشده بود' : 'هنوز هدفی نیست') + '</h2>' +
        (w < cur ? '<p>برای هفته‌های قبل نمیشه هدف اضافه کرد.</p>' : '') + '</section>';
    }
    const prev = findPrevGoals(m.id, w);
    let h = '<section class="card empty"><h2 class="h2">' + (w === cur ? 'هدف‌های این هفته‌ت رو بنویس' : 'برای هفته‌ی بعد برنامه بریز') + '</h2>' +
      '<p>هر کس هدف‌های خودش رو داره. ۳ تا ۵ هدف بذار، مثلا ۵ روز باشگاه یا ۷۰ صفحه کتاب.</p><div class="row">';
    if (prev) h += '<button type="button" class="btn primary" id="copy-prev" data-act="copy-prev">تکرار هدف‌های ' + weekRel(prev.week) + ' (' + fd(Math.min(prev.goals.length, MAX_GOALS)) + ' هدف)</button>';
    h += '<button type="button" class="btn' + (prev ? '' : ' primary') + '" id="goal-new" data-act="goal-new">' + ICON.plus + 'هدف جدید</button></div>';
    h += '<div class="label">شروع سریع</div><div class="templates">' + TEMPLATES.map((t, i) =>
      '<button type="button" class="tpl" id="tpl-' + i + '" data-act="tpl" data-i="' + i + '">' + esc(t.title) + '<small>' +
      (t.kind === 'days' ? fd(t.target) + ' روز در هفته' : fnum(t.target) + ' ' + esc(t.unit) + ' در هفته') + '</small></button>').join('') + '</div></section>';
    return h;
  }
  function nudgeBannerHTML(m) {
    if (S.week !== curWeek()) return '';
    const box = getSocial(curWeek()).nudges[m.id];
    if (!isObj(box)) return '';
    const seen = Math.max(num(LS.get('seen.' + m.id)), S.seenNudge);
    const items = Object.keys(box).map((from) => ({ from: from, t: num(isObj(box[from]) ? box[from].t : 0), i: isObj(box[from]) ? box[from].m : 0 }))
      .filter((x) => x.t > seen && S.byId[x.from] && x.from !== m.id).sort((a, b) => b.t - a.t);
    if (!items.length) return '';
    return '<div class="banner" id="nudge-banner">' + ICON.bell + '<div class="banner-body">' +
      items.slice(0, 3).map((x) => '<div><b>' + esc(nameOf(x.from)) + '</b> سقلمه زد: ' + esc(NUDGES[x.i] || NUDGES[0]) + '</div>').join('') +
      '<div class="banner-actions"><button type="button" class="link-btn" id="seen-nudges" data-act="seen-nudges" data-t="' + items[0].t + '">دیدم</button></div></div></div>';
  }
  function recapHTML(m) {
    const cur = curWeek();
    if (S.week !== cur || dayIdx(today()) > 1) return '';
    const pw = addDays(cur, -7);
    const st = standings(pw);
    if (!st.ranked.length) return '';
    const mine = st.ranked.find((r) => r.m.id === m.id);
    let txt = '';
    if (mine) txt += 'هفته‌ی قبل به <b>' + fpct(mine.stats.score) + '</b> رسیدی' + (st.ranked.length > 1 ? '، رتبه‌ی ' + fd(mine.rank) + ' از ' + fd(st.ranked.length) : '') + '.';
    if (st.top.length) txt += ' قهرمان هفته: <b>' + st.top.map((r) => esc(r.m.name)).join(' و ') + '</b>.';
    if (!txt) return '';
    return '<div class="banner gold" id="recap">' + ICON.crown + '<div class="banner-body"><div>' + txt + '</div><div class="banner-actions">' +
      '<button type="button" class="link-btn" id="recap-go" data-act="goto-week" data-w="' + pw + '" data-tab="race">دیدن کارنامه‌ی هفته‌ی قبل</button></div></div></div>';
  }

  /* ================= view: race ================= */
  function raceHTML() {
    const w = S.week;
    let h = netBanners() + weekBarHTML() + readOnlyBanner();
    if (NET && S.members.length <= 1) h += inviteHTML();
    if (!S.members.length) return h + '<section class="card empty"><h2 class="h2">هنوز کسی عضو نشده</h2><p>اولین نفری که عضو بشه اینجا دیده میشه.</p></section>';
    const st = standings(w);
    h += ringsHTML(st, w) + stakeHTML(st, w) + boardHTML(st, w);
    if (w <= curWeek() && st.ranked.length) h += mapHTML(st, w);
    if (w <= curWeek()) h += feedHTML(w);
    return h;
  }
  function ringsHTML(st, w) {
    const cur = curWeek(), isCur = w === cur, past = w < cur;
    const rows = st.ranked.concat(st.idle);
    const items = rows.map((r) => {
      const crown = st.top.some((t) => t.m.id === r.m.id) ? '<span class="ring-crown" title="صدرنشین">' + ICON.crown + '</span>' : '';
      const sc = r.stats ? r.stats.score : 0;
      return '<div class="ring-item' + (r.stats ? '' : ' idle') + '" style="' + mvar(r.m) + '">' + crown +
        '<div class="ring-box">' + ring(sc, 70, 8) + '<div class="ring-center">' + (r.stats ? fpct(sc) : 'بی‌هدف') + '</div></div>' +
        '<div class="ring-name">' + esc(r.m.name) + '</div>' +
        (r.stats ? '<div class="ring-sub">' + fd(r.stats.full) + ' از ' + fd(r.stats.goals) + ' هدف</div>' : '') + '</div>';
    }).join('');
    let head = past ? 'نتیجه‌ی هفته' : isCur ? 'رقابت این هفته' : 'هفته‌ی بعد';
    let line = st.avg != null ? 'میانگین گروه <b>' + fpct(st.avg) + '</b>' : 'هنوز کسی هدف نذاشته';
    if (isCur) line += '، ' + daysLeftText();
    let champ = '';
    if (past && st.top.length) champ = '<div class="champ">' + ICON.crown + '<span>قهرمان هفته: <b>' + st.top.map((r) => esc(r.m.name)).join(' و ') + '</b> با ' + fpct(st.top[0].stats.score) + '</span></div>';
    else if (isCur && st.top.length) champ = '<div class="champ">' + ICON.crown + '<span>فعلا صدرنشین: <b>' + st.top.map((r) => esc(r.m.name)).join(' و ') + '</b></span></div>';
    return '<section class="card"><div class="h2-row"><h2 class="h2">' + head + '</h2><span class="team-line">' + line + '</span></div>' +
      '<div class="rings">' + items + '</div>' + champ + '</section>';
  }
  function stakeHTML(st, w) {
    const cur = curWeek();
    const soc = getSocial(w);
    const stake = soc.stake;
    const editable = !S.readOnly && !!me() && (w === cur || w === addDays(cur, 7));
    if (!stake && !editable) return '';
    let h = '<section class="card stake"><div class="stake-head"><span class="stake-label">شرط این هفته</span>' +
      (editable ? '<button type="button" class="link-btn" id="stake-edit" data-act="stake">' + (stake ? 'تغییر شرط' : 'گذاشتن شرط') + '</button>' : '') + '</div>';
    if (stake) {
      h += '<p class="stake-text">' + esc(stake.text) + '</p>' + (S.byId[stake.by] ? '<p class="stake-by">پیشنهاد ' + esc(nameOf(stake.by)) + '</p>' : '');
      if (w < cur && st.ranked.length >= 2) {
        let res = '';
        if (st.top.length) res += '<div>قهرمان: <b>' + st.top.map((r) => esc(r.m.name)).join(' و ') + '</b> با ' + fpct(st.top[0].stats.score) + '</div>';
        if (st.last.length) res += '<div>نفر آخر: <b>' + st.last.map((r) => esc(r.m.name)).join(' و ') + '</b> با ' + fpct(st.last[0].stats.score) + '</div>';
        else res += '<div>همه مساوی شدن.</div>';
        h += '<div class="stake-result">' + res + '</div>';
      }
    } else {
      h += '<p class="stake-empty">یه شرط بذارید که هفته جدی‌تر بشه، مثلا نفر آخر شام میده.</p>';
    }
    return h + '</section>';
  }
  function boardHTML(st, w) {
    const rows = st.ranked.concat(st.idle);
    return '<section class="card board"><div class="h2-row"><h2 class="h2">جدول</h2><span class="muted">برای دیدن هدف‌های هر نفر روی اسمش بزن</span></div>' +
      rows.map((r) => boardRow(r, st, w)).join('') + '</section>';
  }
  function boardRow(r, st, w) {
    const m = r.m, s = r.stats, isMe = m.id === S.meId, open = S.expanded.has(m.id);
    const cur = curWeek(), isCur = w === cur;
    const crown = st.top.some((t) => t.m.id === m.id);
    const subs = [];
    if (s) subs.push(fd(s.full) + ' از ' + fd(s.goals) + ' هدف کامل');
    else subs.push(w > cur ? 'هنوز برنامه نچیده' : 'هنوز هدف نذاشته');
    if (s && isCur) { const p = paceOf(s.score); subs.push('<span class="pace-' + p.k + '">' + p.t + '</span>'); }
    const streak = w <= cur ? streakOf(m.id) : 0;
    if (streak > 0) subs.push('<span class="streak" title="هفته‌های موفق پشت سر هم">' + ICON.flame + fd(streak) + '</span>');
    let h = '<article class="mrow' + (open ? ' open' : '') + '" style="' + mvar(m) + '">' +
      '<button type="button" class="mrow-main" id="mr-' + m.id + '" data-act="expand" data-mid="' + m.id + '" aria-expanded="' + open + '">' +
      '<span class="mrow-rank">' + (s ? (crown ? ICON.crown : fd(r.rank)) : '') + '</span>' + avatar(m, 38) +
      '<span class="mrow-info"><span class="mrow-name">' + esc(m.name) + (isMe ? ' <small>(تو)</small>' : '') + '</span>' +
      '<span class="mrow-sub">' + subs.map((x) => '<span>' + x + '</span>').join('') + '</span>' +
      (s ? '<span class="bar"><span style="width:' + pctW(s.score) + '"></span></span>' : '') + '</span>' +
      '<span class="mrow-pct">' + (s ? fpct(s.score) : '') + '</span><span class="mrow-chev">' + ICON.chevD + '</span></button>';
    if (open) h += '<div class="mrow-detail">' + memberDetail(r, w) + '</div>';

  }
  function memberDetail(r, w) {
    const m = r.m, plan = r.plan, cur = curWeek(), td = today();
    let h = '';
    if (!plan || !plan.goals.length) {
      h += '<p class="detail-empty">' + (w < cur ? 'این هفته هدفی نداشت.' : 'هنوز برای این هفته هدفی ننوشته.') + '</p>';
    } else {
      h += plan.goals.map((g, i) => {
        const p = r.stats.per[i];
        let cells = '';
        for (let d = 0; d < 7; d++) {
          const v = entryVal(plan.log, g.id, d);
          const date = addDays(w, d);
          let cls = 'mini-day';
          if (v > 0) cls += g.kind === 'days' ? ' on' : ' part';
          if (date === td) cls += ' today';
          if (date > td) cls += ' future';
          const txt = v > 0 && g.kind === 'amount' ? fnum(v) : DAYS_SHORT[d];
          cells += '<span class="' + cls + '" title="' + esc(DAYS[d] + (v > 0 ? (g.kind === 'amount' ? '، ' + fnum(v) + ' ' + g.unit : '، انجام شد') : '')) + '">' + txt + '</span>';
        }
        return '<div class="mini-goal"><div class="mini-top"><span class="mini-title">' + esc(g.title) + '</span><span class="mini-val' + (p.full ? ' ok' : '') + '">' +
          progressText(g, p) + '</span></div><div class="mini-days">' + cells + '</div></div>';
      }).join('');
    }
    const acts = [];
    if (m.id !== S.meId && w === cur && me() && !S.readOnly) {
      const box = getSocial(cur).nudges[m.id];
      const mine = isObj(box) && isObj(box[S.meId]) ? num(box[S.meId].t) : 0;
      const nudgedToday = mine > 0 && ymd(new Date(mine)) === td;
      acts.push(nudgedToday
        ? '<button type="button" class="btn sm" disabled>' + ICON.bell + 'امروز سقلمه زدی</button>'
        : '<button type="button" class="btn sm" id="nudge-' + m.id + '" data-act="nudge" data-mid="' + m.id + '">' + ICON.bell + 'سقلمه به ' + esc(m.name) + '</button>');
    }
    if (m.id === S.meId) acts.push('<button type="button" class="link-btn" data-act="tab" data-tab="me">رفتن به هفته‌ی من</button>');
    if (acts.length) h += '<div class="detail-actions">' + acts.join('') + '</div>';
    return h;
  }
  function mapHTML(st, w) {
    const td = today();
    let head = '<div class="wmap-row"><span></span>';
    for (let d = 0; d < 7; d++) head += '<span class="wmap-day' + (addDays(w, d) === td ? ' today' : '') + '">' + DAYS_SHORT[d] + '</span>';
    head += '</div>';
    const rows = st.ranked.map((r) => {
      const n = r.plan.goals.length;
      let cells = '';
      for (let d = 0; d < 7; d++) {
        const date = addDays(w, d);
        if (date > td) { cells += '<span class="wmap-cell future" aria-hidden="true"></span>'; continue; }
        let c = 0;
        for (const g of r.plan.goals) if (entryVal(r.plan.log, g.id, d) > 0) c++;
        const f = n ? c / n : 0;
        cells += '<span class="wmap-cell" title="' + esc(r.m.name + '، ' + DAYS[d] + ': ' + fd(c) + ' از ' + fd(n) + ' هدف') + '">' +
          (c ? '<i style="opacity:' + (0.28 + 0.72 * f).toFixed(2) + '"></i>' : '') + '</span>';
      }
      return '<div class="wmap-row" style="' + mvar(r.m) + '"><span class="wmap-name">' + esc(r.m.name) + '</span>' + cells + '</div>';
    }).join('');
    return '<section class="card"><div class="h2-row"><h2 class="h2">نقشه‌ی هفته</h2><span class="muted">هر خونه یعنی اون روز چند تا از هدف‌ها انجام شده</span></div>' +
      '<div class="wmap-grid" role="img" aria-label="نقشه‌ی فعالیت روزانه‌ی هر نفر">' + head + rows + '</div>' +
      '<div class="wmap-legend"><span>کم‌رنگ: بخشی از هدف‌ها</span><span class="sw" style="opacity:.35"></span><span class="sw"></span><span>پررنگ: همه</span></div></section>';
  }
  function feedItems(w) {
    const items = [];
    for (const m of S.members) {
      const plan = getPlan(w, m.id);
      if (!plan) continue;
      for (const g of plan.goals) {
        for (let d = 0; d < 7; d++) {
          const v = entryVal(plan.log, g.id, d);
          if (v > 0) items.push({ type: 'tick', m: m, g: g, d: d, v: v, t: entryTime(plan.log, g.id, d), key: m.id + '_' + g.id + '_' + d });
        }
      }
    }
    const nud = getSocial(w).nudges;
    for (const to of Object.keys(nud)) {
      const box = nud[to];
      if (!isObj(box) || !S.byId[to]) continue;
      for (const from of Object.keys(box)) {
        const x = box[from];
        if (!isObj(x) || !S.byId[from] || from === to) continue;
        const t = num(x.t);
        if (t > 0) items.push({ type: 'nudge', from: S.byId[from], to: S.byId[to], t: t, i: x.m });
      }
    }
    items.sort((a, b) => b.t - a.t || (a.key || '').localeCompare(b.key || ''));
    return items;
  }
  function feedHTML(w) {
    const items = feedItems(w);
    const soc = getSocial(w);
    const shown = S.feedAll ? items : items.slice(0, 8);
    const canGive = !!me() && !S.readOnly;
    const list = shown.map((it) => {
      if (it.type === 'nudge') {
        return '<div class="fitem" style="' + mvar(it.from) + '">' + avatar(it.from, 34) + '<div class="fbody"><div class="fline"><b>' + esc(it.from.name) + '</b> به <b>' +
          esc(it.to.name) + '</b> سقلمه زد</div><div class="fmeta">' + esc(NUDGES[it.i] || NUDGES[0]) + '، ' + relTime(it.t) + '</div></div></div>';
      }
      const givers = kudosGivers(soc, it.key);
      const mineGiven = givers.indexOf(S.meId) >= 0;
      const what = it.g.kind === 'days' ? esc(it.g.title) + ' رو انجام داد' : fnum(it.v) + ' ' + esc(it.g.unit) + ' ' + esc(it.g.title) + ' ثبت کرد';
      let btn;
      if (it.m.id === S.meId || !canGive) {

          '" aria-pressed="' + mineGiven + '">' + ICON.spark + 'دمت گرم' + (givers.length ? '<span class="kc">' + fd(givers.length) + '</span>' : '') + '</button>';
      }
      const giverTxt = givers.length ? '، <span class="gold">' + givers.map((id) => esc(nameOf(id))).join('، ') + '</span>' : '';
      return '<div class="fitem" style="' + mvar(it.m) + '">' + avatar(it.m, 34) + '<div class="fbody"><div class="fline"><b>' + esc(it.m.name) + '</b> ' + what +
        '</div><div class="fmeta">' + DAYS[it.d] + (it.t ? '، ' + relTime(it.t) : '') + giverTxt + '</div></div>' + btn + '</div>';
    }).join('');
    let more = '';

      (items.length ? '<div class="feed-list">' + list + '</div>' + more : '<p class="muted">هنوز کسی این هفته چیزی ثبت نکرده.</p>') + '</section>';

  /* ================= view: trend ================= */
  function trendWeeks() {
    const cur = curWeek(), out = [];
    for (let w = minWeek(); w <= cur; w = addDays(w, 7)) out.push(w);
    return out;
  }
  function trendHTML() {
    const weeks = trendWeeks();
    return netBanners() + readOnlyBanner() + chartHTML(weeks) + fameHTML(weeks) + archiveHTML(weeks);
  }
  function chartHTML(weeks) {
    const withData = weeks.filter((w) => standings(w).ranked.length);
    const W8 = withData.slice(-8);
    if (!W8.length) {
      return '<section class="card"><h2 class="h2">روند هفته‌ها</h2><p class="muted" style="margin-top:6px">وقتی هدف‌ها و تیک‌ها ثبت بشن، اینجا درصد هر نفر رو هفته به هفته کنار هم می‌بینی.</p></section>';
    }
    const vw = $('#view') ? $('#view').clientWidth : 0;
    const width = Math.round(Math.max(250, Math.min(574, (vw || 390) - 66)));
    const height = 230, x0 = 18, x1 = width - 48, y0 = 16, y1 = height - 36;
    const n = W8.length;
    const X = (i) => (n === 1 ? (x0 + x1) / 2 : x1 - (i * (x1 - x0)) / (n - 1));
    const Y = (v) => y0 + (1 - Math.max(0, Math.min(1, v))) * (y1 - y0);
    let g = '';
    for (const v of [0, 0.5, 1]) {
      g += '<line class="ch-grid" x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
        '<text class="ch-label" x="' + (width - 4) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="start" direction="rtl">' + fpct(v) + '</text>';
    }
    g += '<line class="ch-goal" x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(SUCCESS).toFixed(1) + '" y2="' + Y(SUCCESS).toFixed(1) + '"/>' +
      '<text class="ch-label gold" x="' + (width - 4) + '" y="' + (Y(SUCCESS) + 4).toFixed(1) + '" text-anchor="start" direction="rtl">' + fpct(SUCCESS) + '</text>';
    const spacing = n > 1 ? (x1 - x0) / (n - 1) : 999;
    const every = Math.max(1, Math.ceil(52 / spacing));
    W8.forEach((w, i) => {
      if ((n - 1 - i) % every !== 0) return;
      g += '<text class="ch-label" x="' + X(i).toFixed(1) + '" y="' + (height - 12) + '" text-anchor="middle" direction="rtl">' + jDay(w) + '</text>';
    });
    if (n > 1) g += '<polyline class="ch-team" points="' + W8.map((w, i) => X(i).toFixed(1) + ',' + Y(standings(w).avg || 0).toFixed(1)).join(' ') + '"/>';
    const shownMembers = [];
    for (const m of S.members) {
      const pts = W8.map((w, i) => { const s = standings(w).score[m.id]; return s == null ? null : [X(i), Y(s)]; });
      if (!pts.some(Boolean)) continue;
      shownMembers.push(m);
      let seg = [], lines = '';
      const flushSeg = () => { if (seg.length > 1) lines += '<polyline points="' + seg.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>'; seg = []; };
      for (const p of pts) { if (p) seg.push(p); else flushSeg(); }
      flushSeg();
      const dots = pts.map((p, i) => (p ? '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (i === n - 1 ? 5 : 3.5) + '"/>' : '')).join('');
      g += '<g class="ch-m" style="' + mvar(m) + '">' + lines + dots + '</g>';
    }
    const legend = '<div class="legend">' + shownMembers.map((m) => '<span class="legend-item" style="' + mvar(m) + '"><i class="legend-dot"></i>' + esc(m.name) + '</span>').join('') +
      (n > 1 ? '<span class="legend-item"><i class="legend-dash"></i>میانگین گروه</span>' : '') + '</div>';
    return '<section class="card"><div class="h2-row"><h2 class="h2">روند هفته‌ها</h2><span class="muted">درصد پیشرفت هر نفر، جدیدترین هفته سمت چپ</span></div>' +
      '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '" role="img" aria-label="نمودار درصد پیشرفت هر نفر در هفته‌های اخیر">' + g + '</svg></div>' +
      legend + (n === 1 ? '<p class="muted" style="margin-top:8px">از هفته‌ی دوم خط روند کشیده میشه.</p>' : '') + '</section>';
  }
  function fameStats(weeks) {
    const cur = curWeek(), out = {};
    for (const m of S.members) out[m.id] = { wins: 0, weeks: 0, sum: 0, succ: 0, best: 0, run: 0 };
    for (const w of weeks) {
      const st = standings(w), done = w < cur;
      for (const m of S.members) {
        const o = out[m.id], s = st.score[m.id];
        if (done) {
          if (s != null) {
            o.weeks++; o.sum += s;
            if (s >= SUCCESS - 1e-9) { o.succ++; o.run++; o.best = Math.max(o.best, o.run); } else o.run = 0;
          } else o.run = 0;
        } else if (s != null && s >= SUCCESS - 1e-9) {
          o.best = Math.max(o.best, o.run + 1);
        }
      }
      if (done) for (const r of st.top) out[r.m.id].wins++;
    }
    return out;
  }
  function fameHTML(weeks) {
    const cur = curWeek();
    const fs = fameStats(weeks);
    const completed = weeks.filter((w) => w < cur && standings(w).ranked.length).length;
    if (!completed) {
      return '<section class="card"><h2 class="h2">تالار افتخار</h2><p class="muted" style="margin-top:6px">بعد از اولین جمعه، تعداد قهرمانی‌ها، میانگین و رکورد هر نفر اینجا جمع میشه.</p></section>';
    }
    const list = S.members.filter((m) => fs[m.id].weeks > 0)
      .sort((a, b) => fs[b.id].wins - fs[a.id].wins || (fs[b.id].sum / fs[b.id].weeks) - (fs[a.id].sum / fs[a.id].weeks));
    const rows = list.map((m) => {
      const o = fs[m.id];
      return '<div class="fame-row" style="' + mvar(m) + '">' + avatar(m, 36) + '<div class="fame-main"><div class="fame-name">' + esc(m.name) + '</div>' +
        '<div class="fame-stats"><span>میانگین <b>' + fpct(o.sum / o.weeks) + '</b></span><span><b>' + fd(o.succ) + '</b> از ' + fd(o.weeks) + ' هفته موفق</span>' +
        '<span>رکورد زنجیره <b>' + fd(o.best) + '</b> هفته</span></div></div>' +
        '<span class="fame-wins" title="تعداد قهرمانی">' + ICON.crown + fd(o.wins) + '</span></div>';
    }).join('');
    return '<section class="card"><div class="h2-row"><h2 class="h2">تالار افتخار</h2><span class="muted">هفته‌ی موفق یعنی ۸۰٪ یا بیشتر</span></div>' + rows + '</section>';
  }
  function archiveHTML(weeks) {
    const cur = curWeek();
    const rows = [];
    for (let i = weeks.length - 1; i >= 0 && rows.length < 26; i--) {
      const w = weeks[i], st = standings(w);
      if (!st.ranked.length) continue;
      const champ = w < cur ? (st.top.length ? ICON.crown + '<span>' + st.top.map((r) => esc(r.m.name)).join(' و ') + '</span>' : '<span>بدون قهرمان</span>') : '<span>در جریان</span>';
      rows.push('<button type="button" class="arch-row" data-act="goto-week" data-w="' + w + '" data-tab="race"><span class="arch-week">' + weekRange(w, false) +
        '<small>' + weekRel(w) + '، ' + fd(st.ranked.length) + ' نفر</small></span><span class="arch-champ">' + champ + '</span><span class="arch-avg">' + fpct(st.avg) + '</span></button>');
    }
    if (!rows.length) return '';
    return '<section class="card"><div class="h2-row"><h2 class="h2">کارنامه‌ی هفته‌ها</h2><span class="muted">میانگین گروه در هر هفته</span></div>' + rows.join('') + '</section>';
  }

  /* ================= view: onboarding & states ================= */
  function swatchesHTML(name, sel, selfId) {
    const used = new Set(S.members.filter((m) => m.id !== selfId).map((m) => m.color));
    return '<div class="swatches" role="radiogroup" aria-label="رنگ">' + COLORS.map((c, i) =>
      '<label class="swatch' + (i === sel ? ' sel' : '') + '" style="--mc:var(--c' + i + ')"><input type="radio" id="' + name + '-' + i + '" name="' + name + '" value="' + i + '"' +
      (i === sel ? ' checked' : '') + '><span class="swatch-dot"></span><span class="swatch-name">' + c + (used.has(i) ? '<small>گرفته‌شده</small>' : '') + '</span></label>').join('') + '</div>';

  function syncSwatches(scope) {
    if (!scope) return;
    scope.querySelectorAll('.swatch').forEach((lab) => { const inp = lab.querySelector('input'); lab.classList.toggle('sel', !!(inp && inp.checked)); });
  }
  function firstFreeColor() {
    const used = new Set(S.members.map((m) => m.color));

  }
  function onboardHTML() {

      '<p class="lead">جایی برای اینکه با دوستات هر هفته جلو برید. هر کس هدف‌های خودش رو داره و همه پیشرفت همدیگه رو می‌بینن.</p>' +
      '<ol class="steps"><li><span class="n">۱</span><span><b>شنبه</b> ۳ تا ۵ هدف برای هفته‌ت بذار</span></li>' +
      '<li><span class="n">۲</span><span><b>هر روز</b> کارهایی که کردی رو تیک بزن</span></li>' +
      '<li><span class="n">۳</span><span><b>جمعه</b> نتیجه‌ی رقابت معلوم میشه</span></li></ol>';
    if (S.members.length) {
      h += '<div class="already"><span class="label">الان توی گروه</span><div class="avatars">' +
        S.members.map((m) => '<span class="who" style="' + mvar(m) + '">' + avatar(m, 26) + esc(m.name) + '</span>').join('') + '</div></div>';
    }
    h += '<form class="card join" id="join-form" data-form="join" novalidate><h2 class="h2">ورود به گروه</h2>' +
      '<div class="field"><label for="j-name">اسمت</label><input id="j-name" class="input" maxlength="24" placeholder="همونی که دوستات می‌بینن" autocomplete="nickname"></div>' +
      '<div class="field"><span class="label">رنگت</span>' + swatchesHTML('j-color', firstFreeColor(), null) + '</div>' +

    if (claim.length) {

        claim.map((m) => '<button type="button" class="claim-btn" id="claim-' + m.id + '" data-act="claim" data-mid="' + m.id + '" style="' + mvar(m) + '">' + avatar(m, 30) + '<span>من ' + esc(m.name) + ' هستم</span></button>').join('') +
        '</div></div>';
    }
    return h + '</section>';
  }
  function loadingHTML(msg) {
    return '<section class="state-card"><div class="spinner" aria-hidden="true"></div><h2>در حال باز کردن گروه</h2><p>' +
      (msg || 'هدف‌های هفته‌ی هر نفر، تیک‌های روزانه و جدول رقابت اینجا نشون داده میشه.') + '</p>' +
      (S.slow ? '<button type="button" class="btn" id="retry-slow" data-act="retry">دوباره امتحان کن</button>' : '') + '</section>';
  }
  function noDbHTML() {
    return '<section class="state-card"><h2>اینجا ذخیره‌سازی در دسترس نیست</h2>' +
      '<p>هم‌قدم اطلاعات گروه رو داخل Claude نگه می‌داره. این صفحه رو از لینک اصلیش داخل claude.ai باز کن و وارد حسابت شو.</p>' +
      '<p>اگه لینک رو از دوستت گرفتی، ازش بخواه با ایمیلت دعوتت کنه و دسترسی Can edit بده.</p></section>';
  }
  function subErrHTML() {
    if (S.subErr === 'revoked') return '<section class="state-card"><h2>دسترسی عوض شده</h2><p>صفحه رو ببند و دوباره باز کن.</p></section>';
    return '<section class="state-card"><h2>اتصال برقرار نشد</h2><p>اطلاعات گروه بارگذاری نشد. یه بار دیگه امتحان کن.</p>' +
      '<button type="button" class="btn primary" id="retry" data-act="retry">تلاش دوباره</button></section>';

  /* ================= render loop ================= */
  let renderQueued = false;
  function render() {
    if (renderQueued) return;
    renderQueued = true;
    setTimeout(() => {
      renderQueued = false;
      try { draw(); }
      catch (e) {
        try { console.error(e); } catch (e2) { /* ignore */ }
        setView('<section class="state-card"><h2>یه مشکل پیش اومد</h2><p>صفحه رو یه بار ببند و دوباره باز کن.</p></section>');
      }
    }, 0);
  }
  function setView(html) {
    const v = $('#view');
    if (!v || v.__html === html) return;
    const keep = {};
    v.querySelectorAll('input[id], textarea[id]').forEach((el) => { keep[el.id] = el.type === 'radio' || el.type === 'checkbox' ? el.checked : el.value; });
    const active = document.activeElement;
    const fid = active && active.id && v.contains(active) ? active.id : null;
    v.innerHTML = html;
    v.__html = html;
    for (const id in keep) {
      const el = document.getElementById(id);
      if (!el || !v.contains(el)) continue;
      if (el.type === 'radio' || el.type === 'checkbox') el.checked = keep[id]; else el.value = keep[id];
    }
    v.querySelectorAll('.swatches').forEach(syncSwatches);
    if (fid) { const el = document.getElementById(fid); if (el && v.contains(el)) { try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } }
  }
  const allReady = () => S.ready.members && S.ready.plans && S.ready.social;

    if (m && showTabs) {
      const html = avatar(m, 28) + '<span class="me-name">' + esc(m.name) + '</span>';
      if (chip.__html !== html) { chip.innerHTML = html; chip.__html = html; }
      chip.setAttribute('aria-label', 'پروفایل من: ' + m.name);
      chip.hidden = false;
    } else chip.hidden = true;
    $('#tabs-band').hidden = !showTabs;
    const meTab = $('#tab-me');
    meTab.hidden = !m;
    for (const t of ['me', 'race', 'trend']) $('#tab-' + t).setAttribute('aria-selected', String(S.tab === t));
    $('.tabs').style.gridTemplateColumns = m ? '' : 'repeat(2,minmax(0,1fr))';
  }
  function draw() {
    S.memo = new Map();
    S.today = today();
    rebuildMembers();
    resolveMe();
    if (S.phase === 'loading') { updateChrome(false); return setView(loadingHTML()); }
    if (S.phase === 'nodb') { updateChrome(false); return setView(noDbHTML()); }
    if (S.phase === 'gate') { updateChrome(false); return setView(gateHTML()); }
    if (S.subErr) { updateChrome(false); return setView(subErrHTML()); }
    if (!allReady()) { updateChrome(false); return setView(loadingHTML()); }
    if (!me() && !S.readOnly) { updateChrome(false); return setView(installNeeded() ? installHTML() : onboardHTML()); }
    if (!me() && S.tab === 'me') S.tab = 'race';
    const cur = curWeek();
    if (S.week < minWeek()) S.week = minWeek();
    if (S.week > addDays(cur, 7)) S.week = addDays(cur, 7);
    updateChrome(true);
    if (S.tab === 'me') setView(meHTML());
    else if (S.tab === 'race') setView(raceHTML());
    else setView(trendHTML());
  }

  /* ================= sheets ================= */
  function openSheet(html, focusSel, state) {

  }
  const sheetHead = (title) => '<div class="sheet-head"><h2 id="sheet-title">' + esc(title) + '</h2><button type="button" class="icon-btn" id="sheet-x" data-act="sheet-close" aria-label="بستن">' + ICON.x + '</button></div>';

      '<button type="button" class="seg-btn" role="radio" id="gk-amount" data-act="g-kind" data-kind="amount" aria-checked="' + (v.kind === 'amount') + '">مقدار در هفته</button></div>' +
      '<p class="hint" id="g-kind-hint">' + (v.kind === 'days' ? 'هر روز فقط تیک می‌زنی؛ مثلا ۵ روز باشگاه.' : 'هر روز مقدارش رو می‌نویسی؛ مثلا ۲۰ صفحه از ۷۰ صفحه.') + '</p></div>' +
      '<div class="field" id="g-days-field"' + (v.kind === 'days' ? '' : ' hidden') + '><span class="label">چند روز در هفته؟</span><div class="daypick">' + dp + '</div></div>' +

      '<div class="field"><label for="g-target">مقدار کل هفته</label><div class="stepper">' +

        'توی <b>Repository access</b> گزینه‌ی <b>Only select repositories</b> رو بزن و <b class="mono">hamghadam-data</b> رو انتخاب کن.',

        'توکن رو بساز، کپی کن و اینجا بذار.'
      ];
      h += '<details class="card setup" id="setup-card"' + (S.setupOpen ? ' open' : '') + '><summary><span class="h2">ساخت گروه جدید</span><span class="muted">فقط سازنده‌ی گروه</span></summary>' +
        '<div class="setup-body"><p class="muted">اطلاعات گروه توی یه مخزن خصوصی GitHub خودت ذخیره میشه؛ مجانی و از هر جای دنیا در دسترس.</p>' +
        '<ol class="steps small">' + steps.map((x, i) => '<li><span class="n">' + fd(i + 1) + '</span><span>' + x + '</span></li>').join('') + '</ol>' +
        '<form class="join" id="gate-setup" data-form="gate-setup" novalidate>' +
        '<div class="field"><label for="gs-repo">مخزن اطلاعات</label><input id="gs-repo" class="input mono" value="' + esc(NET.guessRepo()) + '" placeholder="username/hamghadam-data" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>' +
        '<div class="field"><label for="gs-token">توکن</label><input id="gs-token" class="input mono" type="password" placeholder="github_pat_" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>' +
        errP('gs-err', S.setupErr) + '<button type="submit" class="btn primary block" id="gs-submit"' + busy + '>اتصال و ساخت گروه</button></form></div></details>';
    }
    return h + '</section>';
  }
  function netBanners() {
    if (!NET || NET.online()) return '';
    return '<div class="banner warn" id="offline-banner">' + ICON.wifi + '<div class="banner-body"><b>اینترنت قطعه</b><div>آخرین اطلاعات ذخیره‌شده رو می‌بینی. تا وصل نشی تغییرات ثبت نمیشه.</div></div></div>';
  }
  const inviteText = () => 'بیا تو گروه هم‌قدم که هر هفته هدف‌هامون رو با هم جلو ببریم.\nاین لینک رو توی Safari باز کن و به صفحه‌ی اصلی اضافه‌ش کن:\n' + NET.inviteLink();
  function inviteHTML() {
    if (!NET || !NET.configured()) return '';
    return '<section class="card invite" id="invite-card"><h2 class="h2">دوستات رو دعوت کن</h2>' +
      '<p class="muted">این لینک رو فقط برای دوستات بفرست. هر کس لینک رو داشته باشه وارد گروه میشه.</p>' +
      '<input id="inv-link" class="input mono" readonly value="' + esc(NET.inviteLink()) + '" aria-label="لینک دعوت">' +
      '<div class="row"><button type="button" class="btn primary" id="inv-share" data-act="invite-share">فرستادن دعوت</button>' +
      '<button type="button" class="btn" id="inv-copy" data-act="invite-copy">کپی لینک</button></div></section>';
  }
  function copyText(text, okMsg) {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? okMsg : 'کپی نشد؛ لینک رو انگشت نگه دار و کپی کن', 3500);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback);
        return;
      }
    } catch (e) { /* use fallback */ }
    fallback();
  }
  function shareInvite() {
    if (!NET || !NET.configured()) return;
    const text = inviteText();
    if (navigator.share) {
      try {
        navigator.share({ title: 'هم‌قدم', text: text }).catch((e) => { if (!e || e.name !== 'AbortError') copyText(text, 'دعوت کپی شد؛ برای دوستات بفرست'); });
        return;
      } catch (e) { /* use copy */ }
    }
    copyText(text, 'دعوت کپی شد؛ برای دوستات بفرست');
  }
  function stopSubs() { for (const u of S.unsubs) { try { u(); } catch (e) { /* ignore */ } } S.unsubs = []; }
  async function startApp() {
    S.db = NET.db;
    S.uid = null;
    S.owner = NET.isOwner();
    S.canWrite = true;
    S.readOnly = false;
    S.gateErr = '';
    S.setupErr = '';
    S.gateBusy = false;
    if (!NET.hasCache()) {
      S.phase = 'loading';
      render();
      try { await NET.firstSync(); }
      catch (e) {
        if (e && e.auth) return;
        S.phase = 'gate'; S.gate = 'offline'; render();
        return;
      }
    }
    S.phase = 'ready';
    subscribe();
    render();
  }
  function initStandalone() {
    NET.onAuthLost(() => {
      if (S.phase === 'gate') return;
      stopSubs();
      S.phase = 'gate';
      S.gate = 'expired';
      S.gateErr = '';
      S.gateBusy = false;
      closeSheet(true);
      render();
    });
    NET.onOnline(() => render());
    if (!NET.configured()) { S.phase = 'gate'; S.gate = 'connect'; render(); return; }
    startApp();
  }
  async function submitGateLink() {
    if (S.gateBusy) return;
    const raw = val('gl-link');
    if (!raw.trim()) { S.gateErr = GATE_MSG.bad_link; render(); return; }
    S.gateBusy = true; S.gateErr = ''; render();
    try { await NET.joinLink(raw); }
    catch (e) { S.gateBusy = false; S.gateErr = gateMsg(e); render(); }
  }
  async function submitGateSetup() {
    if (S.gateBusy) return;
    S.gateBusy = true; S.setupErr = ''; render();
    try { await NET.connect(val('gs-repo'), val('gs-token')); }
    catch (e) { S.gateBusy = false; S.setupErr = gateMsg(e); render(); }
  }

  /* ================= actions ================= */
  function goTab(t) {
    if (t === 'me' && !me()) t = 'race';
    S.tab = t;
    LS.set('tab', t);
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    render();
  }
  function onDay(el) {
    const m = me(), w = S.week, gid = el.dataset.gid, d = parseInt(el.dataset.d, 10);
    if (!m || !(d >= 0 && d < 7) || !dayEditable(w, d)) return;
    const plan = getPlan(w, m.id);
    const g = plan ? plan.goals.find((x) => x.id === gid) : null;
    if (!g) return;
    if (g.kind === 'amount') { amountSheet(gid, d); return; }
    const cur = entryVal(plan.log, gid, d);
    writeEntry(w, gid, d, cur > 0 ? 0 : 1);
    if (!cur && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* ignore */ } }
  }
  function copyPrev() {
    const m = me(), w = S.week;
    if (!m || !canEditGoals(w)) return;
    const existing = getPlan(w, m.id);
    if (existing && existing.goals.length) return;
    const prev = findPrevGoals(m.id, w);
    if (!prev) return;
    const goals = prev.goals.slice(0, MAX_GOALS).map(plainGoal);
    if (queuePatch('plans/' + planKey(w, m.id), { goals: goals }, { week: w, mid: m.id, goals: [], log: {} })) {
      toast(fd(goals.length) + ' هدف از ' + weekRel(prev.week) + ' اضافه شد');
    }
  }
  function toggleKudos(el) {
    const m = me(), w = S.week, key = el.dataset.key, to = el.dataset.to;
    if (!m || S.readOnly || !key || to === m.id || !S.byId[to]) return;
    const given = kudosGivers(getSocial(w), key).indexOf(m.id) >= 0;
    queuePatch('social/' + w, { kudos: { [key]: { [m.id]: given ? 0 : Date.now() } } }, { week: w });
  }
  async function join() {
    if (S.joining || S.readOnly) return;
    const name = clean(val('j-name'), 24);
    if (!name) { setErr('j-err', 'اسمت رو بنویس.'); return; }
    const dup = S.members.find((x) => x.name === name);
    if (dup) { setErr('j-err', dup.uid ? 'این اسم رو یه نفر دیگه داره؛ یه اسم دیگه بنویس.' : 'این اسم توی گروه هست. اگه خودتی، از بخش «قبلا عضو شدی؟» انتخابش کن.'); return; }
    const color = checkedColor('j-color', firstFreeColor());
    const id = newId();
    S.joining = true;
    const btn = document.getElementById('j-submit');
    if (btn) btn.disabled = true;
    S.localMe = id;
    LS.set('me', id);
    try {
      await retry(() => S.db.doc('members/' + id).set({ name: name, color: color, uid: S.uid || null, joinedAt: Date.now() }));
      S.joining = false;
      resolveMe();
      S.tab = 'me';
      render();
      toast('خوش اومدی ' + name + '!');
    } catch (e) {
      S.joining = false;
      S.localMe = null;
      LS.del('me');
      if (btn && document.contains(btn)) btn.disabled = false;
      writeFailed(e);
      render();
    }
  }
  function claim(mid) {
    const m = S.byId[mid];
    if (!m || m.uid) return;
    S.localMe = mid;
    LS.set('me', mid);
    if (S.uid && !S.readOnly) queuePatch('members/' + mid, { uid: S.uid }, null);
    resolveMe();
    S.tab = 'me';
    render();
    toast('سلام ' + m.name + '!');
  }
  const ACTIONS = {
    'tab': (el) => goTab(el.dataset.tab),
    'week': (el) => {
      const dir = parseInt(el.dataset.dir, 10) || 0;
      const next = addDays(S.week, 7 * dir);
      if (next < minWeek() || next > addDays(curWeek(), 7)) return;
      S.week = next; S.feedAll = false; render();
    },
    'week-now': () => { S.week = curWeek(); S.feedAll = false; render(); },
    'goto-week': (el) => {
      const w = el.dataset.w;
      if (!isYmd(w)) return;
      S.week = weekOf(w); S.feedAll = false;
      goTab(el.dataset.tab || 'race');
    },
    'day': onDay,
    'goal-new': () => goalSheet(null, null),
    'goal-edit': (el) => goalSheet(el.dataset.gid, null),
    'tpl': (el) => { const t = TEMPLATES[parseInt(el.dataset.i, 10)]; if (t) goalSheet(null, t); },
    'copy-prev': copyPrev,
    'g-kind': (el) => setGoalKind(el.dataset.kind === 'amount' ? 'amount' : 'days'),
    'g-days': (el) => {
      if (!S.sheet || S.sheet.type !== 'goal') return;
      const n = parseInt(el.dataset.n, 10);
      if (!(n >= 1 && n <= 7)) return;
      S.sheet.days = n;
      document.querySelectorAll('.dp').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
    },
    'g-step': (el) => {
      const inp = document.getElementById('g-target');
      if (!inp) return;
      let v = parseAmount(inp.value);
      if (!(v > 0)) v = 0;
      const st = amountStep(v || 10);
      v = Math.max(1, Math.round((v + st * (parseInt(el.dataset.step, 10) || 0)) * 10) / 10);
      inp.value = fplain(Math.min(100000, v));
    },
    'g-unit': (el) => { const inp = document.getElementById('g-unit'); if (inp) inp.value = el.dataset.u || ''; },
    'g-delete': (el) => deleteGoal(el),
    'amt-step': (el) => {
      const inp = document.getElementById('amt');
      if (!inp || !S.sheet) return;
      let v = parseAmount(inp.value);
      if (!(v >= 0)) v = 0;
      v = Math.max(0, Math.round((v + S.sheet.step * (parseInt(el.dataset.step, 10) || 0)) * 10) / 10);
      inp.value = v ? fplain(v) : '';
      setErr('amt-err', '');
    },
    'amt-add': (el) => {
      const inp = document.getElementById('amt');
      if (!inp) return;
      let v = parseAmount(inp.value);
      if (!(v >= 0)) v = 0;
      inp.value = fplain(Math.min(100000, v + (parseFloat(el.dataset.v) || 0)));
      setErr('amt-err', '');
    },
    'amt-clear': () => submitAmount(true),
    'expand': (el) => { const mid = el.dataset.mid; if (S.expanded.has(mid)) S.expanded.delete(mid); else S.expanded.add(mid); render(); },
    'kudos': toggleKudos,
    'nudge': (el) => nudgeSheet(el.dataset.mid),
    'nudge-send': (el) => sendNudge(parseInt(el.dataset.i, 10) || 0),
    'stake': stakeSheet,
    'stake-pick': (el) => { const t = document.getElementById('s-text'); const s = STAKES[parseInt(el.dataset.i, 10)]; if (t && s) { t.value = s; setErr('s-err', ''); } },
    'stake-clear': () => submitStake(true),
    'profile': profileSheet,
    'switch-user': () => { LS.del('me'); S.localMe = null; S.meId = null; closeSheet(true); render(); },
    'rm-member': (el) => removeMember(el),
    'claim': (el) => claim(el.dataset.mid),
    'sheet-close': () => closeSheet(),
    'feed-more': () => { S.feedAll = !S.feedAll; render(); },
    'seen-nudges': (el) => {
      const m = me();
      const t = num(el.dataset.t);
      if (!m) return;
      S.seenNudge = Math.max(S.seenNudge, t);
      LS.set('seen.' + m.id, Math.max(t, num(LS.get('seen.' + m.id))));
      render();
    },
    'retry': () => { S.subErr = null; S.slow = false; subscribe(); render(); },
    'skip-install': () => { S.skipInstall = true; LS.set('skip-install', '1'); render(); },
    'copy-link': () => { copyText(location.href, 'لینک کپی شد؛ توی Safari بازش کن'); },
    'invite-share': () => { shareInvite(); },
    'invite-copy': () => { copyText(inviteText(), 'دعوت کپی شد؛ برای دوستات بفرست'); },
    'own-copy': () => { if (NET) copyText(NET.ownLink(), 'لینک کپی شد؛ روی گوشیت توی Safari بازش کن'); },
    'gate-retry': () => { S.phase = 'loading'; render(); initStandalone(); }
  };
  function onClick(e) {
    const t = e.target;
    if (t && t.classList && t.classList.contains('sheet-back')) { closeSheet(); return; }
    const el = t && t.closest ? t.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    try { fn(el, e); } catch (err) { try { console.error(err); } catch (e2) { /* ignore */ } toast('یه مشکل پیش اومد؛ دوباره امتحان کن.'); }
  }
  function onSubmit(e) {
    const f = e.target;
    if (!f || !f.dataset) return;
    e.preventDefault();
    const k = f.dataset.form;
    try {
      if (k === 'goal') submitGoal();
      else if (k === 'amount') submitAmount(false);
      else if (k === 'profile') submitProfile();
      else if (k === 'stake') submitStake(false);
      else if (k === 'join') join();
      else if (k === 'gate-setup') submitGateSetup();
      else if (k === 'gate-link') submitGateLink();
    } catch (err) { try { console.error(err); } catch (e2) { /* ignore */ } toast('یه مشکل پیش اومد؛ دوباره امتحان کن.'); }
  }
  let toastTimer = 0;
  function toast(msg, ms) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2300);
  }

  /* ================= data subscriptions ================= */
  function rebuildMembers() {
    const list = [];
    for (const id of Object.keys(S.rawMembers)) {
      const m = normMember(id, effective('members/' + id, S.rawMembers[id]));
      if (m) list.push(m);
    }
    list.sort((a, b) => a.joinedAt - b.joinedAt || (a.id < b.id ? -1 : 1));
    S.members = list;
    S.byId = {};
    for (const m of list) S.byId[m.id] = m;
  }
  function resolveMe() {
    let m = null;
    if (S.uid) m = S.members.find((x) => x.uid === S.uid) || null;
    if (!m) {
      for (const id of [S.localMe, LS.get('me')]) {
        if (id && S.byId[id] && (!S.byId[id].uid || S.byId[id].uid === S.uid)) { m = S.byId[id]; break; }
      }
    }
    S.meId = m ? m.id : null;
  }
  function markReady(k, snap) {
    S.got[k] = true;
    if (!snap || !snap.metadata || !snap.metadata.fromCache) S.ready[k] = true;
  }
  function subscribe() {
    for (const u of S.unsubs) { try { u(); } catch (e) { /* ignore */ } }
    S.unsubs = [];
    S.subErr = null;
    S.ready = { members: false, plans: false, social: false };
    S.got = { members: false, plans: false, social: false };
    const onErr = (e) => { S.subErr = (e && e.code) || 'unavailable'; render(); };
    try {
      S.unsubs.push(S.db.collection('members').onSnapshot((snap) => {
        const raw = {};
        for (const d of snap.docs) { const v = d.data(); if (isObj(v)) raw[d.id] = v; }
        S.rawMembers = raw;
        rebuildMembers();
        markReady('members', snap);
        clearSettled('members/');
        resolveMe();
        render();
      }, onErr));
      S.unsubs.push(S.db.collection('plans').onSnapshot((snap) => {
        const map = {};
        for (const d of snap.docs) { const v = d.data(); if (isObj(v)) map[d.id] = v; }
        S.plans = map;
        markReady('plans', snap);
        clearSettled('plans/');
        render();
      }, onErr));
      S.unsubs.push(S.db.collection('social').onSnapshot((snap) => {
        const map = {};
        for (const d of snap.docs) { const v = d.data(); if (isObj(v) && isYmd(d.id)) map[d.id] = v; }
        S.social = map;
        markReady('social', snap);
        clearSettled('social/');
        render();
      }, onErr));
    } catch (e) {
      S.subErr = 'unavailable';
    }
    const gen = S.unsubs;
    setTimeout(() => {
      if (S.unsubs !== gen) return;
      let ch = false;
      for (const k in S.ready) if (!S.ready[k] && S.got[k]) { S.ready[k] = true; ch = true; }
      if (ch) render();
    }, 2500);
    setTimeout(() => {
      if (S.unsubs !== gen) return;
      if (!allReady() && !S.subErr) { S.slow = true; render(); }
    }, 12000);
  }
  function tick() {
    const t = today();
    if (t !== S.today) {
      const oldCur = S.today ? weekOf(S.today) : null;
      if (oldCur && S.week === oldCur) S.week = weekOf(t);
    }
    render();
  }
  async function init() {
    S.week = curWeek();
    const savedTab = LS.get('tab');
    if (savedTab === 'me' || savedTab === 'race' || savedTab === 'trend') S.tab = savedTab;
    const hashTab = { my: 'me', race: 'race', trend: 'trend' }[(location.hash || '').slice(1)];
    if (hashTab) S.tab = hashTab;
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet-root').firstChild) { e.preventDefault(); closeSheet(); } });
    document.addEventListener('change', (e) => { const t = e.target; if (t && t.type === 'radio') syncSwatches(t.closest('.swatches')); });
    document.addEventListener('input', (e) => { const f = e.target && e.target.closest ? e.target.closest('form') : null; if (f) f.querySelectorAll('.form-err').forEach((x) => { x.textContent = ''; }); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    document.addEventListener('toggle', (e) => { if (e.target && e.target.id === 'setup-card') S.setupOpen = e.target.open; }, true);
    let rz = 0;
    window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'trend') render(); }, 200); });
    setInterval(tick, 60000);
    render();
    if (NET) {
      try { if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* ignore */ }
      return initStandalone();
    }
    const c = window.claude;
    const use = (name) => {
      try { return c && typeof c.use === 'function' ? Promise.resolve(c.use(name)).catch(() => null) : Promise.resolve(null); }
      catch (e) { return Promise.resolve(null); }
    };
    const got = await Promise.all([use('db'), use('user')]);
    const db = got[0], user = got[1];
    if (!db) { S.phase = 'nodb'; render(); return; }
    S.db = db;
    S.user = user;
    if (user) {
      try { const id = await user.id(); S.uid = typeof id === 'string' && id ? id : null; } catch (e) { S.uid = null; }
      try { S.owner = (await user.isOwner()) === true; } catch (e) { S.owner = false; }
      try { const cw = await user.can('data.write'); S.canWrite = cw === true ? true : cw === false ? false : null; } catch (e) { S.canWrite = null; }
    }
    if (S.canWrite === false) S.readOnly = true;
    S.phase = 'ready';
    subscribe();
    render();
  }

  try {
    window.__hq = Object.freeze({
      fn: Object.freeze({ toJ: toJ, weekOf: weekOf, dayIdx: dayIdx, addDays: addDays, parseAmount: parseAmount, fpct: fpct, fnum: fnum, fd: fd, fplain: fplain,
        planStats: planStats, goalProgress: goalProgress, weekRange: weekRange, esc: esc, clean: clean, merge: merge, normGoal: normGoal, normPlan: normPlan }),
      state: () => S,
      tick: tick,
      standings: (w) => { S.memo = new Map(); return standings(w); },
      streakOf: (mid) => { S.memo = new Map(); return streakOf(mid); }
    });
  } catch (e) { /* ignore */ }

  init();
})();
</script>

</body>
